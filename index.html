<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grammar Check POC</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitizer for security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }

        .error {
            color: red;
        }

        /* Make Markdown look nicer */
        .result h1, .result h2, .result h3 {
            margin-top: 10px;
        }

        .result ul {
            padding-left: 20px;
        }

        .result code {
            background: #eaeaea;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .result pre {
            background: #272822;
            color: white;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Grammar Check App (POC)</h1>

    <textarea id="sentenceInput" placeholder="Enter your sentence here..."></textarea>

    <button onclick="checkGrammar()">Check Grammar</button>

    <div id="result" class="result"></div>
</div>

<script>
    async function checkGrammar() {
        const sentence = document.getElementById("sentenceInput").value;
        const resultDiv = document.getElementById("result");

        if (!sentence.trim()) {
            resultDiv.innerHTML = "<span class='error'>Please enter a sentence.</span>";
            return;
        }

        resultDiv.innerHTML = "Checking...";

        try {
            const response = await fetch("http://127.0.0.1:8000/comp3path", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ sentence: sentence })
            });

            const data = await response.json();

            if (data.status === "success") {

                // Convert Markdown to HTML
                const rawHTML = marked.parse(data.corrected_sentence);

                // Sanitize to prevent XSS
                const safeHTML = DOMPurify.sanitize(rawHTML);

                resultDiv.innerHTML = safeHTML;

            } else {
                resultDiv.innerHTML = "<span class='error'>Error processing request.</span>";
            }

        } catch (error) {
            resultDiv.innerHTML = "<span class='error'>Server error. Make sure backend is running.</span>";
        }
    }
</script>

</body>
</html>
